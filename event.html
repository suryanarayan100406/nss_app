<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0F1712"><title>Event — NSS IIIT Naya Raipur</title>
  <link rel="stylesheet" href="css/style.css"><style>
    .dynamic-shell{background:var(--paper);min-height:100vh}.dynamic-hero{min-height:72vh;padding:170px clamp(20px,8vw,120px) 90px;background:var(--ink);color:var(--bone);position:relative;overflow:hidden}.dynamic-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,23,18,.98),rgba(15,23,18,.52),rgba(15,23,18,.2));pointer-events:none}.dynamic-hero-media{position:absolute;inset:0;opacity:.6}.dynamic-hero-media img{width:100%;height:100%;object-fit:cover}.dynamic-copy{max-width:800px;position:relative;z-index:1}.dynamic-copy .eyebrow{color:var(--marigold)}.dynamic-copy h1{font:600 clamp(3rem,8vw,7.5rem)/.92 var(--font-display);letter-spacing:-.04em;max-width:12ch;margin:16px 0 24px}.dynamic-copy .lead{max-width:58ch;color:var(--bone-dim);font-size:1.08rem}.dynamic-meta{display:flex;flex-wrap:wrap;gap:10px 22px;color:var(--bone-dim);font-size:.82rem;margin:26px 0}.dynamic-meta span{border-left:1px solid var(--marigold);padding-left:10px}.dynamic-main{padding:clamp(70px,10vh,130px) clamp(20px,8vw,120px)}.dynamic-main h2{font:600 clamp(2rem,4vw,3.4rem)/1.05 var(--font-display);margin-bottom:28px}.dynamic-story{max-width:68ch;font-size:1.05rem;color:var(--ink-on-paper-dim);white-space:pre-line}.dynamic-gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:50px}.dynamic-gallery figure{margin:0;background:var(--paper-2)}.dynamic-gallery img{width:100%;aspect-ratio:4/3;object-fit:cover}.dynamic-gallery figcaption{font-size:.75rem;padding:12px;color:var(--ink-on-paper-dim)}.dynamic-error{padding:170px 20px;text-align:center}.dynamic-error h1{font:600 4rem var(--font-display)}@media(max-width:700px){.dynamic-gallery{grid-template-columns:1fr 1fr}.dynamic-hero{min-height:80vh;padding-top:140px}.dynamic-copy h1{font-size:3.4rem}}@media(max-width:480px){.dynamic-gallery{grid-template-columns:1fr}}
  </style>
</head>
<body><div class="dynamic-shell" id="eventPage"><div class="dynamic-error"><p>Loading event story…</p></div></div><script>
(function(){var root=document.getElementById('eventPage'),api=window.NSS_API_ROOT||(location.hostname==='localhost'&&location.port!=='4000'?'http://localhost:4000/api/v1':'/api/v1'),slug=new URLSearchParams(location.search).get('slug');if(!slug){root.innerHTML='<div class="dynamic-error"><h1>Event not found</h1><p>Choose an event from the public calendar.</p></div>';return;}fetch(api+'/public/events/'+encodeURIComponent(slug)).then(function(r){if(!r.ok)throw Error();return r.json()}).then(function(body){var e=body.event;document.title=e.title+' — NSS IIIT Naya Raipur';var date=new Date(e.startAt).toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'});root.innerHTML='<section class="dynamic-hero"><div class="dynamic-hero-media">'+(e.cover&&e.cover.url?'<img src="'+e.cover.url+'" alt="'+(e.cover.altText||e.title).replace(/"/g,'&quot;')+'">':'')+'</div><div class="dynamic-copy"><span class="eyebrow">'+e.category+' · '+date+'</span><h1>'+e.title+'</h1><p class="lead">'+e.summary+'</p><div class="dynamic-meta"><span>'+date+'</span><span>'+e.timezone+'</span><span>'+ (e.venue||'Venue to be announced')+'</span></div><a class="btn-primary" href="event-'+(e.slug)+'.html">← Legacy story</a></div></section><main class="dynamic-main"><span class="eyebrow">Event story</span><h2>Service, remembered in photographs.</h2><p class="dynamic-story">'+(e.description||e.summary)+'</p><section class="dynamic-gallery"><h2 style="grid-column:1/-1">Published gallery</h2>'+(e.gallery&&e.gallery.length?e.gallery.map(function(item){return '<figure><img loading="lazy" src="'+item.url+'" alt="'+(item.altText||'Event photograph').replace(/"/g,'&quot;')+'"><figcaption>'+(item.caption||item.altText||'')+(item.credit?' · '+item.credit:'')+'</figcaption></figure>'}).join(''):'<p>No published community photographs yet.</p>')+'</section></main>';}).catch(function(){root.innerHTML='<div class="dynamic-error"><h1>Event unavailable</h1><p>This event may be a draft, scheduled, or no longer published.</p></div>';});})();
  </script></body></html>
