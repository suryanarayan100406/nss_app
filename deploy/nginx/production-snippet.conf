# Add this server block as a new site under /etc/nginx/sites-available/nss-iiitnr.
# Back up the existing Nginx configuration before enabling it; this block does
# not replace or edit unrelated virtual hosts.
server {
  listen 80;
  listen [::]:80;
  server_name nss.example.edu.in;
  root /srv/nss-app;
  index index.html;
  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://127.0.0.1:4000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
  location /media/ {
    proxy_pass http://127.0.0.1:4000/media/;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=3600";
  }
  # Database-backed public pages are rendered by the API; assets remain local.
  location = / { proxy_pass http://127.0.0.1:4000/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_intercept_errors on; error_page 502 503 504 =200 /__nss-fallback/index.html; }
  location = /index.html { proxy_pass http://127.0.0.1:4000/index.html; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_intercept_errors on; error_page 502 503 504 =200 /__nss-fallback/index.html; }
  location = /team.html { proxy_pass http://127.0.0.1:4000/team.html; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_intercept_errors on; error_page 502 503 504 =200 /__nss-fallback/team.html; }
  location ~ ^/events/[a-z0-9-]+$ { proxy_pass http://127.0.0.1:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_intercept_errors on; error_page 502 503 504 =404; }
  location ~ ^/event(?:-[a-z-]+)?\.html$ { proxy_pass http://127.0.0.1:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_intercept_errors on; error_page 502 503 504 =200 /__nss-fallback$uri; }
  location = /event.html { proxy_pass http://127.0.0.1:4000/event.html; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_intercept_errors on; error_page 502 503 504 =200 /__nss-fallback/event.html; }
  location /manage/assets/ { alias /srv/nss-app/apps/admin-web/dist/assets/; }
  location /fonts/ { alias /srv/nss-app/apps/admin-web/dist/fonts/; }
  location = /manage { return 301 /manage/; }
  location /manage/ { root /srv/nss-app/apps/admin-web/dist; try_files /index.html =404; }
  location ~ ^/(?:apps|scripts|deploy|var|node_modules|prisma)(?:/|$) { return 404; }
  location ~ /\.(?!well-known) { deny all; }
  location ~ ^/__nss-fallback/(event(?:-[a-z-]+)?\.html)$ { internal; alias /srv/nss-app/$1; }
  location = /__nss-fallback/index.html { internal; alias /srv/nss-app/index.html; }
  location = /__nss-fallback/team.html { internal; alias /srv/nss-app/team.html; }
  location = /__nss-fallback/event.html { internal; alias /srv/nss-app/event.html; }
  location / { try_files $uri $uri/ =404; }
}
