server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 20m;

  location /api/ { proxy_pass http://api:4000/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location /manage/ { proxy_pass http://admin-web:5173; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /media/ { proxy_pass http://api:4000/media/; proxy_set_header Host $host; add_header Cache-Control "public, max-age=3600"; }
  location = / { proxy_pass http://api:4000/; proxy_set_header Host $host; proxy_intercept_errors on; error_page 502 503 504 =200 /__nss-fallback/index.html; }
  location = /index.html { proxy_pass http://api:4000/index.html; proxy_set_header Host $host; proxy_intercept_errors on; error_page 502 503 504 =200 /__nss-fallback/index.html; }
  location = /team.html { proxy_pass http://api:4000/team.html; proxy_set_header Host $host; proxy_intercept_errors on; error_page 502 503 504 =200 /__nss-fallback/team.html; }
  location ~ ^/events/[a-z0-9-]+$ { proxy_pass http://api:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_intercept_errors on; error_page 502 503 504 =404; }
  location ~ ^/event(?:-[a-z-]+)?\.html$ { proxy_pass http://api:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_intercept_errors on; error_page 502 503 504 =200 /__nss-fallback$uri; }
  location = /event.html { proxy_pass http://api:4000/event.html; proxy_set_header Host $host; proxy_intercept_errors on; error_page 502 503 504 =200 /__nss-fallback/event.html; }
  location ~ /\.(?!well-known) { deny all; }
  location ~ ^/__nss-fallback/(event(?:-[a-z-]+)?\.html)$ { internal; alias /usr/share/nginx/html/$1; }
  location = /__nss-fallback/index.html { internal; alias /usr/share/nginx/html/index.html; }
  location = /__nss-fallback/team.html { internal; alias /usr/share/nginx/html/team.html; }
  location = /__nss-fallback/event.html { internal; alias /usr/share/nginx/html/event.html; }
  location / { try_files $uri $uri/ =404; }
}
