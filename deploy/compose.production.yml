services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: ["/var/lib/nss-postgres:/var/lib/postgresql/data"]
    expose: ["5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"], interval: 10s, timeout: 5s, retries: 10 }
  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    env_file: [/srv/nss-app/.env.production]
    environment: { PORT: "4000", NODE_ENV: production, PRIVATE_MEDIA_ROOT: /data/private-media, PUBLIC_MEDIA_ROOT: /data/public-media }
    ports: ["127.0.0.1:4000:4000"]
    volumes: ["/var/lib/nss-media:/data"]
    command: sh -c "npm run db:migrate && npm run start:api"
    depends_on: { db: { condition: service_healthy } }
  worker:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    env_file: [/srv/nss-app/.env.production]
    environment: { NODE_ENV: production, PRIVATE_MEDIA_ROOT: /data/private-media, PUBLIC_MEDIA_ROOT: /data/public-media }
    volumes: ["/var/lib/nss-media:/data"]
    command: npm run start:worker
    depends_on: { db: { condition: service_healthy } }
