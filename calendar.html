<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event Calendar — NSS IIIT Naya Raipur</title><link rel="stylesheet" href="css/style.css"><style>.public-tool{min-height:100vh;background:var(--paper);padding:150px clamp(20px,7vw,100px) 100px}.public-tool h1{font:600 clamp(3rem,7vw,6rem)/.95 var(--font-display);letter-spacing:-.04em;max-width:10ch;margin:15px 0}.public-tool>p{max-width:56ch;color:var(--ink-on-paper-dim)}.cal-nav{display:flex;align-items:center;gap:14px;margin:55px 0 18px}.cal-nav button{border:1px solid var(--line-on-paper);padding:8px 13px;background:transparent}.cal-nav strong{font:600 1.4rem var(--font-display);min-width:220px;text-align:center}.public-agenda{display:flex;flex-direction:column;gap:10px;max-width:980px}.public-event{display:grid;grid-template-columns:85px 1fr auto;gap:22px;padding:24px;border-top:1px solid var(--line-on-paper);align-items:center}.public-event-date strong{display:block;font:600 2.1rem var(--font-display);line-height:1}.public-event-date span{text-transform:uppercase;color:var(--rust);font-size:.7rem}.public-event h2{font:600 1.5rem var(--font-display);margin:0 0 4px}.public-event p{margin:0;color:var(--ink-on-paper-dim);font-size:.82rem}.public-event a{color:var(--rust);font-size:.78rem;font-weight:600}@media(max-width:620px){.public-event{grid-template-columns:60px 1fr}.public-event a{grid-column:2}.cal-nav strong{min-width:155px}}
</style></head><body><main class="public-tool" id="calendar"><span class="eyebrow">NSS / IIIT Naya Raipur</span><h1>Dates worth showing up for.</h1><p>Published drives, camps, sports days, and community work. All times are shown in the event's configured timezone.</p><div class="cal-nav"><button id="prev">←</button><strong id="month"></strong><button id="next">→</button><button id="today">Today</button></div><div class="public-agenda" id="items"></div></main><script>
(function(){var api=window.NSS_API_ROOT||(location.hostname==='localhost'&&location.port!=='4000'?'http://localhost:4000/api/v1':'/api/v1'),month=new Date();var label=document.getElementById('month'),items=document.getElementById('items');function load(){var from=new Date(month.getFullYear(),month.getMonth(),1).toISOString(),to=new Date(month.getFullYear(),month.getMonth()+1,0,23,59,59).toISOString();label.textContent=month.toLocaleDateString('en-IN',{month:'long',year:'numeric'});fetch(api+'/public/events?pageSize=100&from='+encodeURIComponent(from)+'&to='+encodeURIComponent(to)).then(function(r){return r.json()}).then(function(body){items.innerHTML=body.items.length?body.items.map(function(e){var d=new Date(e.startAt);return '<article class="public-event"><div class="public-event-date"><strong>'+d.toLocaleDateString('en-IN',{day:'2-digit'})+'</strong><span>'+d.toLocaleDateString('en-IN',{weekday:'short'})+'</span></div><div><span class="eyebrow">'+e.category+'</span><h2>'+e.title+'</h2><p>'+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',timeZone:e.timezone})+' · '+(e.venue||'Venue to be announced')+' · '+e.timezone+'</p></div><a href="event.html?slug='+encodeURIComponent(e.slug)+'">View story →</a></article>'}).join(''):'<div class="public-event"><p>No published events in this month.</p></div>'}).catch(function(){items.innerHTML='<div class="public-event"><p>Calendar is temporarily unavailable.</p></div>'})}document.getElementById('prev').onclick=function(){month=new Date(month.getFullYear(),month.getMonth()-1,1);load()};document.getElementById('next').onclick=function(){month=new Date(month.getFullYear(),month.getMonth()+1,1);load()};document.getElementById('today').onclick=function(){month=new Date();load()};load()})();
</script></body></html>
